[project]
name = "sales-rag"
version = "0.1.0"
description = "OpenClaw sales analytics agent — Olist Brazilian E-Commerce dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "kaggle>=2.0.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "chromadb>=1.5.7",
    "sentence-transformers>=3.0.0",
    "fpdf2>=2.7.0",
    "scikit-learn>=1.5.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

# Use CPU-only PyTorch everywhere. sentence-transformers' embedding model runs
# on CPU here, and this avoids pulling ~5-6 GB of unused CUDA libraries into the
# Linux container (the default torch wheel on Linux is the CUDA build).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
